name: Create OC
on:
  workflow_dispatch:
    inputs:
      name:
        description: 'Character name'
        required: true
      description:
        description: 'Character description'
        required: false
      category:
        description: 'Category (default: dnd)'
        required: false
        default: 'dnd'
      tags:
        description: 'Comma-separated tags'
        required: false
      image:
        description: 'Path to character image'
        required: false
      language:
        description: 'Language (default: English)'
        required: false
        default: 'English'

jobs:
  create-oc:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: feature/novels-ocs

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Create OC
        run: |
          python scripts/create_oc.py \
            --name "${{ inputs.name }}" \
            --description "${{ inputs.description }}" \
            --category "${{ inputs.category }}" \
            --tags "${{ inputs.tags }}" \
            --image "${{ inputs.image }}" \
            --language "${{ inputs.language }}"

      - name: Commit changes
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add .
          git commit -m "Add new OC: ${{ inputs.name }}"
          git push