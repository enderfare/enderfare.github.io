name: Create Blog Post
on:
  workflow_dispatch:
    inputs:
      title:
        description: "Post title"
        required: true
      tags:
        description: "Comma-separated tags"
        required: false
      lists:
        description: "Comma-separated list slugs"
        required: false
      excerpt:
        description: "Post excerpt"
        required: false
      pinned:
        description: "Pin this post"
        required: false
        default: "false"

jobs:
  create-post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: feature/novels-ocs

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Create blog post
        run: |
          python scripts/create_blog_post.py \
            --title "${{ inputs.title }}" \
            --tags "${{ inputs.tags }}" \
            --lists "${{ inputs.lists }}" \
            --excerpt "${{ inputs.excerpt }}" \
            ${{ inputs.pinned == 'true' && '--pinned' || '' }}

      - name: Commit changes
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add .
          git commit -m "Add new blog post: ${{ inputs.title }}"
          git push
