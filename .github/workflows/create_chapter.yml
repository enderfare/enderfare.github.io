name: Create Chapter
on:
  workflow_dispatch:
    inputs:
      novel:
        description: "Novel slug (directory name)"
        required: true
      title:
        description: "Chapter title"
        required: true
      content:
        description: "Chapter content (markdown)"
        required: false
      parent:
        description: "Parent chapter slug (for nested chapters)"
        required: false

jobs:
  create-chapter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: feature/novels-ocs

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Create chapter
        run: |
          python scripts/create_chapter.py \
            --novel "${{ inputs.novel }}" \
            --title "${{ inputs.title }}" \
            --content "${{ inputs.content }}" \
            ${{ inputs.parent && format('--parent "{0}"', inputs.parent) || '' }}

      - name: Commit changes
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add .
          git commit -m "Add chapter '${{ inputs.title }}' to novel '${{ inputs.novel }}'"
          git push
