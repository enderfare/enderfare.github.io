<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
        <title>Blog · Ender's Domain</title>
        <meta name="author" content="EnderFare" />
        <meta name="description" content="My blog – dev, writing, and roleplay." />
        <link rel="icon" type="image/jpeg" href="/media/images/icon.jpg" />
        <link href="/common.css" rel="stylesheet" type="text/css" media="all" />
        <link href="style.css" rel="stylesheet" type="text/css" media="all" />
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    </head>

    <body>
        <header>
            <h1>my blog</h1>
        </header>

        <nav>
            <ul></ul> <!-- Filled by loader -->
        </nav>

        <div id="content">
            <aside id="sidebar">
                <div id="avatar">
                    <img src="/media/images/icon.jpg" alt="my icon" />
                </div>
                <div id="bio">
                    <div class="bio-name" id="bio-name"></div>
                    <div class="bio-tagline" id="bio-tagline"></div>
                    <div class="bio-details">
                        <span><span class="bio-label">a:</span> <span class="bio-value" id="bio-age"></span></span>
                        <span><span class="bio-label">p:</span> <span class="bio-value" id="bio-pronouns"></span></span>
                        <span><span class="bio-label">s:</span> <span class="bio-value"
                                id="bio-sexuality"></span></span>
                    </div>
                </div>
                <ul id="social-links"></ul>
            </aside>

            <main class="page-main">
                <div class="prose">
                    <h1>Blog</h1>
                    <p>My thoughts, updates, and stories.</p>

                    <div class="blog-header">
                        <div class="blog-meta">
                            <span id="post-count">Loading posts…</span>
                        </div>
                    </div>

                    <div id="post-grid"></div>
                    <button id="back-to-top" aria-label="Back to top">↑</button>
                </div>
            </main>

            <aside id="filter-sidebar">
                <div class="filter-heading"><i class="fas fa-sliders-h"></i> Filters</div>

                <details class="filter-group" open>
                    <summary><i class="fas fa-tags"></i> Tags</summary>
                    <div id="sidebar-tag-filters"></div>
                </details>

                <details class="filter-group" open>
                    <summary><i class="fas fa-layer-group"></i> Lists</summary>
                    <div id="sidebar-list-filters"></div>
                </details>

                <details class="filter-group" open>
                    <summary><i class="fas fa-sort-amount-down"></i> Sort</summary>
                    <div id="sort-filters">
                        <label class="filter-option">
                            <input type="radio" name="sort" value="newest" checked>
                            <span>Newest first</span>
                        </label>
                        <label class="filter-option">
                            <input type="radio" name="sort" value="oldest">
                            <span>Oldest first</span>
                        </label>
                    </div>
                </details>

                <details class="filter-group" open>
                    <summary><i class="fas fa-object-group"></i> Group</summary>
                    <div id="group-filters">
                        <label class="filter-option">
                            <input type="radio" name="group" value="none" checked>
                            <span>None</span>
                        </label>
                        <label class="filter-option">
                            <input type="radio" name="group" value="list">
                            <span><i class="fas fa-layer-group"></i> By List</span>
                        </label>
                        <label class="filter-option">
                            <input type="radio" name="group" value="tag">
                            <span><i class="fas fa-tags"></i> By Tag</span>
                        </label>
                    </div>
                </details>
            </aside>
        </div>

        <footer></footer>

        <script src="/js/loader.js" defer></script>
        <script src="/js/blog-data.js" defer></script>
        <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
        <script src="blog.js" defer></script>
    </body>

</html>
