<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
        <title>Post · Ender's Domain</title>
        <meta name="author" content="EnderFare" />
        <meta name="description" content="Reading a blog post." />
        <link rel="icon" type="image/jpeg" href="/media/images/icon.jpg" />
        <link href="/common.css" rel="stylesheet" type="text/css" media="all" />
        <link href="style.css" rel="stylesheet" type="text/css" media="all" />
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    </head>

    <body>
        <header>
            <h1>my blog</h1>
        </header>

        <nav>
            <ul></ul> <!-- filled by loader.js -->
        </nav>

        <div id="content">
            <!-- Left sidebar -->
            <aside id="sidebar">
                <div id="avatar">
                    <img src="/media/images/icon.jpg" alt="my icon" />
                </div>
                <div id="bio">
                    <div class="bio-name" id="bio-name"></div>
                    <div class="bio-tagline" id="bio-tagline"></div>
                    <div class="bio-details">
                        <span><span class="bio-label">a:</span> <span class="bio-value" id="bio-age"></span></span>
                        <span><span class="bio-label">p:</span> <span class="bio-value" id="bio-pronouns"></span></span>
                        <span><span class="bio-label">s:</span> <span class="bio-value"
                                id="bio-sexuality"></span></span>
                    </div>
                </div>
                <ul id="social-links"></ul>
            </aside>

            <!-- Main wrapper: contains main content + post navigation -->
            <div class="main-wrapper">
                <main class="page-main">
                    <div class="prose" id="post-container">
                        <div id="post-content"></div>
                        <!-- Navigation is now OUTSIDE this div -->
                    </div>
                </main>

                <!-- Post navigation (prev/next) – placed directly under main -->
                <nav id="post-navigation" class="post-nav"></nav>
            </div>

            <!-- Right sidebar (list tree) -->
            <aside id="list-sidebar">
                <div class="list-sidebar-heading"><i class="fas fa-sitemap"></i> In this series</div>
                <div id="list-tree"></div>
            </aside>
        </div>

        <footer></footer>

        <script src="/js/loader.js" defer></script>
        <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
        <script src="post.js" defer></script>
    </body>

</html>
