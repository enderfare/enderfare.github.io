<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Chapter · Ender's Domain</title>
        <link rel="icon" type="image/jpeg" href="/media/images/icon.jpg" />
        <link href="/common.css" rel="stylesheet" type="text/css" media="all" />
        <link href="style.css" rel="stylesheet" type="text/css" media="all" />
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
        <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    </head>

    <body>
        <header>
            <h1 id="novel-title">my novel</h1>
        </header>
        <nav>
            <ul></ul>
        </nav>
        <div id="content">
            <div id="sidebar">
                <div id="avatar"><img src="/media/images/icon.jpg" alt="my icon" /></div>
                <div id="bio">
                    <div class="bio-name" id="bio-name"></div>
                    <div class="bio-tagline" id="bio-tagline"></div>
                    <div class="bio-details">
                        <span><span class="bio-label">a:</span> <span class="bio-value" id="bio-age"></span></span>
                        <span><span class="bio-label">p:</span> <span class="bio-value" id="bio-pronouns"></span></span>
                        <span><span class="bio-label">s:</span> <span class="bio-value"
                                id="bio-sexuality"></span></span>
                    </div>
                </div>
                <ul id="social-links"></ul>
            </div>
            <main class="page-main">
                <div class="prose" id="chapter-container">
                    <div id="chapter-content"></div>
                </div>
            </main>
            <aside id="list-sidebar">
                <div class="list-sidebar-heading"><i class="fas fa-sitemap"></i> Chapters</div>
                <div id="chapter-tree"></div>
            </aside>
        </div>
        <footer></footer>
        <script src="/js/loader.js" defer></script>
        <script src="chapter.js" defer></script>
    </body>

</html>
