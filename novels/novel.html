<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Novel · Ender's Domain</title>
        <link rel="icon" type="image/jpeg" href="/media/images/icon.jpg" />
        <link href="/common.css" rel="stylesheet" type="text/css" media="all" />
        <link href="style.css" rel="stylesheet" type="text/css" media="all" />
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    </head>

    <body>
        <header>
            <h1 id="novel-title">my novel</h1>
        </header>
        <nav>
            <ul></ul>
        </nav>
        <div id="content">
            <div id="sidebar">
                <div id="avatar"><img src="/media/images/icon.jpg" alt="my icon" /></div>
                <div id="bio">
                    <div class="bio-name" id="bio-name"></div>
                    <div class="bio-tagline" id="bio-tagline"></div>
                    <div class="bio-details">
                        <span><span class="bio-label">a:</span> <span class="bio-value" id="bio-age"></span></span>
                        <span><span class="bio-label">p:</span> <span class="bio-value" id="bio-pronouns"></span></span>
                        <span><span class="bio-label">s:</span> <span class="bio-value"
                                id="bio-sexuality"></span></span>
                    </div>
                </div>
                <ul id="social-links"></ul>
            </div>
            <main class="page-main">
                <div class="prose">
                    <a class="back-link" href="/novels/index.html"><i class="fas fa-arrow-left"></i> All novels</a>
                    <section class="story-hero">
                        <p class="eyebrow"><i class="fas fa-book-open"></i> Story library</p>
                        <h1 id="novel-headline">Novel Title</h1>
                        <p id="novel-description"></p>
                        <div class="story-stats"><span><i class="fas fa-globe"></i> <span id="novel-language"></span></span><span><i class="fas fa-list-ol"></i> <span id="novel-total"></span></span></div>
                    </section>
                    <div id="chapter-grid"></div>
                    <div id="chapter-counter"></div>
                </div>
            </main>
            
            <aside id="filter-sidebar">
                <div class="filter-heading"><i class="fas fa-sliders-h"></i> Filters</div>
                <details class="filter-group" open>
                    <summary><i class="fas fa-tags"></i> Tags</summary>
                    <div id="sidebar-tag-filters"></div> <!-- required -->
                </details>

                <details class="filter-group" open>
                    <summary><i class="fas fa-sort-amount-down"></i> Sort</summary>
                    <div id="sidebar-sort-filters">
                        <label class="filter-option">
                            <input type="radio" name="chapter-sort" value="oldest" checked>
                            <span>Oldest first</span>
                        </label>
                        <label class="filter-option">
                            <input type="radio" name="chapter-sort" value="newest">
                            <span>Newest</span>
                        </label>
                        <label class="filter-option">
                            <input type="radio" name="chapter-sort" value="title">
                            <span>Title</span>
                        </label>
                    </div>
                </details>
            </aside>
        </div>
        <footer></footer>
        <script src="/js/loader.js" defer></script>
        <script src="novel.js" defer></script>
    </body>

</html>
