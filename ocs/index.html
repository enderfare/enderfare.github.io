<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>OCs · Ender's Domain</title>
        <meta name="author" content="EnderFare" />
        <link rel="icon" type="image/jpeg" href="/media/images/icon.jpg" />
        <link href="/common.css" rel="stylesheet" type="text/css" media="all" />
        <link href="style.css" rel="stylesheet" type="text/css" media="all" />
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    </head>

    <body>
        <header>
            <h1>my original characters</h1>
        </header>
        <nav>
            <ul></ul>
        </nav>
        <div id="content">
            <div id="sidebar">
                <div id="avatar"><img src="/media/images/icon.jpg" alt="my icon" /></div>
                <div id="bio">
                    <div class="bio-name" id="bio-name"></div>
                    <div class="bio-tagline" id="bio-tagline"></div>
                    <div class="bio-details">
                        <span><span class="bio-label">a:</span> <span class="bio-value" id="bio-age"></span></span>
                        <span><span class="bio-label">p:</span> <span class="bio-value" id="bio-pronouns"></span></span>
                        <span><span class="bio-label">s:</span> <span class="bio-value"
                                id="bio-sexuality"></span></span>
                    </div>
                </div>
                <ul id="social-links"></ul>
            </div>
            <main class="page-main">
                <div class="prose">
                    <div class="section-intro oc-intro">
                        <p class="eyebrow"><i class="fas fa-sparkles"></i> Character archive</p>
                        <h1>Original Characters</h1>
                        <p>A growing gallery of the people, worlds, and campaigns I care about.</p>
                        <span class="content-count" id="oc-count">Loading characters…</span>
                    </div>
                    <div id="oc-grid"></div>
                </div>
            </main><!-- Inside #content, after <main> -->
            <aside id="filter-sidebar">
                <div class="filter-heading"><i class="fas fa-sliders-h"></i> Filters</div>
                <details class="filter-group" open>
                    <summary><i class="fas fa-tags"></i> Tags</summary>
                    <div id="sidebar-tag-filters"></div>
                </details>
                <details class="filter-group" open>
                    <summary><i class="fas fa-language"></i> Language</summary>
                    <div id="sidebar-language-filters"></div>
                </details>
                <details class="filter-group" open>
                    <summary><i class="fas fa-sort-alpha-down"></i> Sort</summary>
                    <div id="sidebar-sort-filters">
                        <label class="filter-option"><input type="radio" name="oc-sort" value="name" checked><span>Name</span></label>
                        <label class="filter-option"><input type="radio" name="oc-sort" value="tags"><span>Most tags</span></label>
                    </div>
                </details>
            </aside>
        </div>
        <footer></footer>
        <script src="/js/loader.js" defer></script>
        <script src="ocs.js" defer></script>
    </body>

</html>
