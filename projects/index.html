<!DOCTYPE html>
<html lang="en">

	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
		<title>Projects Â· Ender's Domain</title>
		<meta name="author" content="EnderFare" />
		<meta name="description" content="My projects â€“ code, TTRPGs, and more." />
		<link rel="icon" type="image/jpeg" href="/media/images/icon.jpg" />
		<link href="/common.css" rel="stylesheet" type="text/css" media="all" />
		<link href="style.css" rel="stylesheet" type="text/css" media="all" />
		<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
	</head>

	<body>
		<header>
			<h1>my projects</h1>
		</header>

		<nav>
			<ul></ul> <!-- Filled by loader.js -->
		</nav>

		<div id="content">
			<!-- Left sidebar (bio, social) -->
			<div id="sidebar">
				<div id="avatar">
					<img src="/media/images/icon.jpg" alt="my icon" />
				</div>
				<div id="bio">
					<div class="bio-name" id="bio-name"></div>
					<div class="bio-tagline" id="bio-tagline"></div>
					<div class="bio-details">
						<span><span class="bio-label">a:</span> <span class="bio-value" id="bio-age"></span></span>
						<span><span class="bio-label">p:</span> <span class="bio-value" id="bio-pronouns"></span></span>
						<span><span class="bio-label">s:</span> <span class="bio-value"
								id="bio-sexuality"></span></span>
					</div>
				</div>
				<ul id="social-links"></ul>
			</div>

			<!-- Main content -->
			<main class="page-main">
				<div class="prose">
					<h1>Projects</h1>
					<p>Here are some of the things I've been building. Click on a card to explore.</p>
					<!-- The fork toggle is now in the right sidebar -->
					<div id="project-grid"></div>
				</div>
			</main>

			<!-- Right filter sidebar (like blog) -->
			<aside id="filter-sidebar">
				<div class="filter-heading"><i class="fas fa-sliders-h"></i> Filters</div>

				<!-- Source filter -->
				<details class="filter-group" open>
					<summary><i class="fas fa-layer-group"></i> Source</summary>
					<div id="sidebar-source-filters">
						<label class="filter-option all-option">
							<input type="radio" name="source" value="all" checked>
							<span>All</span>
							<span class="filter-count" id="source-count-all">0</span>
						</label>
						<label class="filter-option">
							<input type="radio" name="source" value="github">
							<span><i class="fab fa-github"></i> GitHub</span>
							<span class="filter-count" id="source-count-github">0</span>
						</label>
						<label class="filter-option">
							<input type="radio" name="source" value="other">
							<span><i class="fas fa-box"></i> Other</span>
							<span class="filter-count" id="source-count-other">0</span>
						</label>
					</div>
				</details>

				<!-- Topic filter -->
				<details class="filter-group" open>
					<summary><i class="fas fa-tags"></i> Topics</summary>
					<div id="sidebar-topic-filters"></div>
				</details>

				<!-- Forks toggle (only affects GitHub) -->
				<details class="filter-group" open>
					<summary><i class="fas fa-code-branch"></i> Forks</summary>
					<div id="fork-toggle-wrap">
						<label class="toggle-switch">
							<input type="checkbox" id="showForks">
							<span class="slider"></span>
							<span class="toggle-label">Show forks</span>
						</label>
						<span class="fork-hint"
							style="font-size:0.6rem; opacity:0.5; display:block; margin-top:0.2rem;">(only
							applies to GitHub repos)</span>
					</div>
				</details>
			</aside>
		</div>

		<footer></footer>

		<script src="/js/loader.js" defer></script>
		<script src="projects.js" defer></script>
	</body>

</html>
